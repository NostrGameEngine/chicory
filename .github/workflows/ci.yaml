name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  ci:
    name: CI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]
        version: [11, 17, 21, 25]
        exclude:
        - os: windows-11-arm
          version: 11
        - os: windows-11-arm
          version: 17
        - os: windows-11-arm
          version: 25
        # Flaky, re-enable when the bug on the JVM is fixed
        - os: windows-latest
          version: 17
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Checkout testsuite
        uses: actions/checkout@v6
        with:
          repository: WebAssembly/testsuite
          path: testsuite
          # The ref needs to stay in sync with the default value in test-gen-plugin
          ref: 88e97b0f742f4c3ee01fea683da130f344dd7b02
      - name: Checkout wasi-testsuite
        uses: actions/checkout@v6
        with:
          repository: WebAssembly/wasi-testsuite
          path: wasi-testsuite
          # Keep in sync with the default ref in wasi-test-gen-plugin.
          ref: 6345da2237c562d9a94e281332c653b5528fdd52
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ matrix.version }}'
          cache: maven
      - name: Test Java
        run: mvn -B clean install
        env:
          MAVEN_OPTS: "-ea"
      - name: Collect ARM JVM diagnostics
        if: failure() && runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          lscpu > ci-cpu.txt
          java -XX:+PrintFlagsFinal -version > ci-jvm.txt 2>&1
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-failure-${{ matrix.os }}-java-${{ matrix.version }}
          path: |
            **/target/surefire-reports/
            runtime-tests/target/generated-resources/compiled-wast/comments/
            runtime/target/runtime-*.jar
            wasm-tools/target/wasm-tools-*.jar
            ci-cpu.txt
            ci-jvm.txt

  docs-ci:
    runs-on: ubuntu-latest
    name: CI - Docs
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - name: set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build Chicory
        run: ./mvnw -B -Dquickly
      - name: Test Docs
        working-directory: docs
        run: |
          npm ci
          npm run build
          npm run test

  test-results:
    name: Test Results
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: [runtime-tests, compiler-tests, wasi-tests]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Checkout testsuite
        uses: actions/checkout@v6
        with:
          repository: WebAssembly/testsuite
          path: testsuite
          # The ref needs to stay in sync with the default value in test-gen-plugin
          ref: 88e97b0f742f4c3ee01fea683da130f344dd7b02
      - name: Checkout wasi-testsuite
        uses: actions/checkout@v6
        with:
          repository: WebAssembly/wasi-testsuite
          path: wasi-testsuite
          # Keep in sync with the default ref in wasi-test-gen-plugin.
          ref: 6345da2237c562d9a94e281332c653b5528fdd52
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - name: Test Java
        run: ./mvnw -B clean install
      - name: Name
        id: name
        run: |
          case ${{ matrix.folder }} in
            runtime-tests)
              echo "NAME=Interpreter" >> $GITHUB_ENV
              echo "BADGE_NAME=interpreter" >> $GITHUB_ENV
              ;;
            compiler-tests)
              echo "NAME=Compiler" >> $GITHUB_ENV
              echo "BADGE_NAME=compiler" >> $GITHUB_ENV
              ;;
            wasi-tests)
              echo "NAME=WASI" >> $GITHUB_ENV
              echo "BADGE_NAME=wasi" >> $GITHUB_ENV
              ;;
          esac
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040
        id: test-results
        with:
          check_name: ${{ env.NAME }} Tests Results
          comment_mode: off
          compare_to_earlier_commit: false
          files: './${{ matrix.folder }}/**/surefire-reports/*.xml'
      - name: Publish badge conditional
        id: publish
        if: |
          (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' ||
            github.event_name != 'workflow_run' && github.ref == 'refs/heads/main')
        run: echo "badge=true" >> $GITHUB_OUTPUT
      - name: Set badge color
        shell: bash
        if: steps.publish.outputs.badge
        run: |
          case ${{ fromJSON( steps.test-results.outputs.json ).conclusion }} in
            success)
              echo "BADGE_COLOR=31c653" >> $GITHUB_ENV
              ;;
            failure)
              echo "BADGE_COLOR=800000" >> $GITHUB_ENV
              ;;
            neutral)
              echo "BADGE_COLOR=696969" >> $GITHUB_ENV
              ;;
          esac
      - name: Create badge
        uses: emibcn/badge-action@808173dd03e2f30c980d03ee49e181626088eee8
        if: steps.publish.outputs.badge
        with:
          label: 'Tests ${{ env.NAME }}'
          status: '${{ fromJSON( steps.test-results.outputs.json ).stats.tests_succ }} success, ${{ fromJSON( steps.test-results.outputs.json ).stats.tests_skip }} skip, ${{ fromJSON( steps.test-results.outputs.json ).stats.tests_fail }} failures, ${{ fromJSON( steps.test-results.outputs.json ).stats.tests_error }} errors, ${{ fromJSON( steps.test-results.outputs.json ).stats.tests }} total'
          color: ${{ env.BADGE_COLOR }}
          path: badge-${{ env.BADGE_NAME }}.svg
