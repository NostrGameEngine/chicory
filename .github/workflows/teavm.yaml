name: NGE TeaVM Runtime

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime and build-time modules (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [javascript, wasm-gc]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Compile and execute with the NGE TeaVM fork
        run: mvn -B -ntp -U -Dteavm-tests -Dteavm.backend=${{ matrix.backend }} -pl teavm-tests -am verify
      - name: Upload generated TeaVM application
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teavm-runtime-${{ matrix.backend }}
          path: teavm-tests/target/${{ matrix.backend }}/
